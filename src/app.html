<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <script nonce="%sveltekit.nonce%">
      // Resolve the theme before first paint so reloads never flash the wrong palette.
      const systemDark = () =>
        typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches;
      try {
        const stored = localStorage.getItem("onyx-theme");
        const preference =
          stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
        const dark = preference === "dark" || (preference === "system" && systemDark());
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.themePreference = preference;
        const color = localStorage.getItem("onyx-color-theme");
        const colorThemes = [
          "ember",
          "monochrome",
          "forest",
          "ocean",
          "arctic",
          "phosphor",
          "espresso",
          "ink",
          "lavender",
          "rose",
          "solarized",
        ];
        document.documentElement.dataset.colorTheme = colorThemes.includes(color) ? color : "ember";
      } catch {
        document.documentElement.dataset.theme = systemDark() ? "dark" : "light";
        document.documentElement.dataset.themePreference = "system";
        document.documentElement.dataset.colorTheme = "ember";
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
